<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Client Acquisition</title>
<style>
  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --brand:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; padding:16px; }
  main { max-width:22rem; text-align:center; }
  button { margin-top:1rem; background:var(--brand); color:#fff; border:0; border-radius:.5rem; padding:.75rem 1.25rem; font-size:1rem; }
  p { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Can't reach the server</h1>
  <p>Your phone can't reach the platform. Check that the laptop is switched on and that both devices are on the same Wi-Fi.</p>
  <p>Nothing was sent. Messages and calls only happen when you tap them.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
